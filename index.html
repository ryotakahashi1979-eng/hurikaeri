<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>さんすう じしゅうアプリ</title>
  <style>
    body { font-family: sans-serif; background: #eef9ff; padding: 20px; text-align: center; }
    .card { background: white; max-width: 500px; margin: 0 auto; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    button { background: #4caf50; color: white; border: none; padding: 10px 20px; font-size: 16px; border-radius: 8px; cursor: pointer; margin: 8px; }
    button:hover { background: #45a049; }
    select, input { font-size: 16px; padding: 8px; margin: 8px; border-radius: 6px; border: 1px solid #ccc; }
    .hidden { display: none; }
    .explain-box { background: #fffde7; border: 2px solid #fff59d; padding: 15px; border-radius: 8px; text-align: left; margin-bottom: 15px; }
    .mark { font-size: 60px; font-weight: bold; height: 70px; line-height: 70px; }
    .correct { color: #e53935; }
    .incorrect { color: #1e88e5; }
  </style>
</head>
<body>

<div class="card">
  <!-- 1. トップ画面 -->
  <div id="screen-top">
    <h1>さんすう じしゅうアプリ</h1>
    <button onclick="showScreen('screen-user')">児童用（じどうよう）</button>
  </div>

  <!-- 2. 児童情報選択画面 -->
  <div id="screen-user" class="hidden">
    <h2>がくねん・くみ・なまえ</h2>
    <div>
      <select id="grade">
        <option value="1">1ねんせい</option>
        <option value="2">2ねんせい</option>
        <option value="3" selected>3年生</option>
      </select>
      <select id="class-num">
        <option value="1">1くみ</option>
        <option value="2">2くみ</option>
      </select>
    </div>
    <div>
      <input type="text" id="student-name" placeholder="なまえを入力" value="たろう">
    </div>
    <button onclick="goToUnitScreen()">つぎへ</button>
  </div>

  <!-- 3. 単元選択画面 -->
  <div id="screen-unit" class="hidden">
    <h2>たんげんを えらぼう</h2>
    <div id="unit-buttons"></div>
  </div>

  <!-- 4. 学習・問題画面 -->
  <div id="screen-study" class="hidden">
    <div id="explain-area" class="explain-box">
      <h3>💡 きほんの まとめ</h3>
      <p id="explain-text"></p>
    </div>

    <div id="quiz-area">
      <p id="question-num" style="font-weight:bold; color:#666;"></p>
      <h2 id="question-text"></h2>
      <input type="number" id="user-answer" placeholder="こたえ">
      <br>
      <button onclick="checkAnswer()">こたえる</button>
      <div id="result-mark" class="mark"></div>
    </div>
  </div>
</div>

<script>
  // APIキーを設定（未設定の場合は下のローカル問題集で動作します）
  const API_KEY = "YOUR_GEMINI_API_KEY";

  // 静的な問題データ（APIが使えない場合のバックアップ）
  const fallbackData = {
    "かけ算のあつまり": {
      explanation: "1つ分の かず × いくつ分 ＝ ぜんぶの かず になります。計算のじゅんじょを たしかめよう！",
      questions: [
        { q: "1ほん 50えんの えんぴつを 4ほん かいました。代金はいくら？", a: 200 },
        { q: "1はこに 6こ入った クッキーが 3はこ あります。ぜんぶで いくつ？", a: 18 },
        { q: "8 × 5 の こたえは？", a: 40 }
      ]
    },
    "わり算のきほん": {
      explanation: "ぜんぶの かず ÷ いくつ分（または1人分）で 計算します。九九をつかって こたえを みつけよう！",
      questions: [
        { q: "12この あめを 3人に おなじ数ずつ わけると、1人分は いくつ？", a: 4 },
        { q: "20ページの本を 1日4ページずつ よむと、何日で よみおわる？", a: 5 },
        { q: "36 ÷ 6 の こたえは？", a: 6 }
      ]
    }
  };

  let currentUnit = "";
  let currentQuestions = [];
  let currentIndex = 0;

  // Web Audio API による音の再生
  function playSound(type) {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);

    if (type === 'correct') {
      // 正解音（ピンポン♪）
      osc.frequency.setValueAtTime(660, ctx.currentTime); // ミ
      osc.frequency.setValueAtTime(880, ctx.currentTime + 0.15); // ラ
      gain.gain.setValueAtTime(0.1, ctx.currentTime);
      osc.start();
      osc.stop(ctx.currentTime + 0.4);
    } else {
      // 不正解音（ブブー）
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(150, ctx.currentTime);
      gain.gain.setValueAtTime(0.1, ctx.currentTime);
      osc.start();
      osc.stop(ctx.currentTime + 0.3);
    }
  }

  function showScreen(id) {
    document.querySelectorAll('.card > div').forEach(el => el.classList.add('hidden'));
    document.getElementById(id).classList.remove('hidden');
  }

  function goToUnitScreen() {
    const name = document.getElementById('student-name').value;
    if (!name) {
      alert("なまえを入力してください");
      return;
    }
    const unitDiv = document.getElementById('unit-buttons');
    unitDiv.innerHTML = "";
    
    Object.keys(fallbackData).forEach(unit => {
      const btn = document.createElement('button');
      btn.innerText = unit;
      btn.onclick = () => startStudy(unit);
      unitDiv.appendChild(btn);
    });
    showScreen('screen-unit');
  }

  async function startStudy(unitName) {
    currentUnit = unitName;
    currentIndex = 0;
    
    // API呼び出し（設定されていない場合や失敗時はバックアップデータを使用）
    if (API_KEY && API_KEY !== "YOUR_GEMINI_API_KEY") {
      try {
        const prompt = `小学校算数の「${unitName}」について、児童が自学自習するためのデータをJSON形式で出力してください。
説明文(explanation)と、数値で答えられる練習問題(questions: 質問文qと数値答えa)を3問作成してください。
形式: {"explanation": "...", "questions": [{"q": "...", "a": 10}, ...]}`;
        
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: prompt }] }],
            generationConfig: { responseMimeType: "application/json" }
          })
        });
        const data = await res.json();
        const parsed = JSON.parse(data.candidates[0].content.parts[0].text);
        currentQuestions = parsed.questions;
        document.getElementById('explain-text').innerText = parsed.explanation;
      } catch(e) {
        useFallback(unitName);
      }
    } else {
      useFallback(unitName);
    }

    showScreen('screen-study');
    showQuestion();
  }

  function useFallback(unitName) {
    const data = fallbackData[unitName];
    currentQuestions = data.questions;
    document.getElementById('explain-text').innerText = data.explanation;
  }

  function showQuestion() {
    document.getElementById('result-mark').innerText = "";
    document.getElementById('user-answer').value = "";
    
    if (currentIndex < currentQuestions.length) {
      document.getElementById('question-num').innerText = `だい ${currentIndex + 1} もん`;
      document.getElementById('question-text').innerText = currentQuestions[currentIndex].q;
    } else {
      alert("おめでとうございます！ このたんげんは くりあです！");
      showScreen('screen-unit');
    }
  }

  function checkAnswer() {
    const userAns = parseFloat(document.getElementById('user-answer').value);
    const mainAns = currentQuestions[currentIndex].a;
    const markDiv = document.getElementById('result-mark');

    if (userAns === mainAns) {
      playSound('correct');
      markDiv.className = "mark correct";
      markDiv.innerText = "◯";
      setTimeout(() => {
        currentIndex++;
        showQuestion();
      }, 1200);
    } else {
      playSound('incorrect');
      markDiv.className = "mark incorrect";
      markDiv.innerText = "×";
    }
  }
</script>
</body>
</html>
